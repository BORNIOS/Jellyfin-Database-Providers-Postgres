name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - main
      - 'release/*'
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Database.Providers.Postgres.sln

      - name: Build (Release)
        run: dotnet build Jellyfin.Database.Providers.Postgres.sln -c Release --no-restore

      - name: Suite de verificación
        env:
          POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
        run: dotnet test Tests/Jellyfin.Database.Providers.Postgres.Tests/Jellyfin.Database.Providers.Postgres.Tests.csproj -c Release --no-build --no-restore

      - name: Publish
        run: dotnet publish Jellyfin.Database.Providers.Postgres/Jellyfin.Database.Providers.Postgres.csproj -c Release --no-restore -o artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Database.Providers.Postgres
          path: artifacts/

      # La suite anterior usa el runtime de la versión de Jellyfin más nueva que se admite (ver el proyecto de
      # pruebas). El mismo paquete tiene que funcionar también en la versión base contra la que se compila.
      - name: Suite con el runtime de la versión base de Jellyfin
        env:
          POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
        run: |
          project=Jellyfin.Database.Providers.Postgres/Jellyfin.Database.Providers.Postgres.csproj
          jellyfin=$(sed -n 's:.*<JellyfinVersion>\(.*\)</JellyfinVersion>.*:\1:p' "$project")
          efcore=$(sed -n 's:.*Include="Microsoft.EntityFrameworkCore.Design" Version="\([^"]*\)".*:\1:p' "$project")
          echo "Jellyfin $jellyfin, EF Core $efcore"
          dotnet test Tests/Jellyfin.Database.Providers.Postgres.Tests/Jellyfin.Database.Providers.Postgres.Tests.csproj -c Release \
            -p:JellyfinTestVersion="$jellyfin" -p:EfCoreTestVersion="$efcore"
