name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - main
      - 'release/*'
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Database.Providers.Postgres.sln

      - name: Build (Release)
        run: dotnet build Jellyfin.Database.Providers.Postgres.sln -c Release --no-restore

      - name: Compatibility and migration checks
        env:
          POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
        run: dotnet run --project tests/CompatibilityChecks -c Release --no-build

      - name: Publish
        run: dotnet publish Jellyfin.Database.Providers.Postgres/Jellyfin.Database.Providers.Postgres.csproj -c Release --no-restore -o artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Database.Providers.Postgres
          path: artifacts/
