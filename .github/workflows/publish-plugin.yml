name: Publish Jellyfin PostgreSQL Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional: version to validate against csproj on manual runs (example: 1.0.0.0)'
        required: false
        type: string

jobs:
  build:
    name: Build and Package Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: .NET diagnostics
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet nuget list source

      - name: Determine plugin version
        id: version
        shell: bash
        run: |
          CSPROJ_VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("Jellyfin.Database.Providers.Postgres/Jellyfin.Database.Providers.Postgres.csproj").read_text(encoding="utf-8")
          match = re.search(r"<Version>\s*([^<\s]+)\s*</Version>", text)
          if not match:
              raise SystemExit("Missing <Version> in Jellyfin.Database.Providers.Postgres/Jellyfin.Database.Providers.Postgres.csproj")
          print(match.group(1))
          PY
          )

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            PACKAGE_VERSION="${TAG_VERSION#v}"
            if [[ "${PACKAGE_VERSION}" != "${CSPROJ_VERSION}" ]]; then
              echo "Tag version (${PACKAGE_VERSION}) does not match csproj <Version> (${CSPROJ_VERSION})." >&2
              echo "Update Jellyfin.Database.Providers.Postgres/Jellyfin.Database.Providers.Postgres.csproj first, then tag v${CSPROJ_VERSION}." >&2
              exit 1
            fi
          else
            PACKAGE_VERSION="${CSPROJ_VERSION}"
            TAG_VERSION="v${PACKAGE_VERSION}"
            if [[ -n "${{ github.event.inputs.version }}" && "${{ github.event.inputs.version }}" != "${PACKAGE_VERSION}" ]]; then
              echo "Manual input version (${{ github.event.inputs.version }}) does not match csproj <Version> (${PACKAGE_VERSION})." >&2
              exit 1
            fi
          fi

          echo "Resolved version from csproj: ${PACKAGE_VERSION}"
          echo "TAG_VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"
          echo "VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"

      - name: Restore dependencies (with retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Restore attempt ${attempt}/3"
            if dotnet restore Jellyfin.Database.Providers.Postgres/Jellyfin.Database.Providers.Postgres.csproj --verbosity normal; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Restore failed; retrying in 10s..."
              sleep 10
            fi
          done
          echo "dotnet restore failed after 3 attempts" >&2
          exit 1

      - name: Build plugin
        run: dotnet build Jellyfin.Database.Providers.Postgres/Jellyfin.Database.Providers.Postgres.csproj -c Release /p:ContinuousIntegrationBuild=true /p:Version=$VERSION

      - name: Publish plugin output
        run: dotnet publish Jellyfin.Database.Providers.Postgres/Jellyfin.Database.Providers.Postgres.csproj -c Release -o ./publish_out /p:Version=$VERSION

      - name: Package plugin ZIP
        run: |
          mkdir -p release
          cd publish_out
          zip -j ../release/Jellyfin.Database.Providers.Postgres.zip \
            Jellyfin.Database.Providers.Postgres.dll \
            Npgsql.dll \
            Npgsql.EntityFrameworkCore.PostgreSQL.dll
          cd ..

      - name: Generate release metadata and manifest
        run: python .github/scripts/generate_release_metadata.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-postgres-plugin
          path: release/

      - name: Commit manifest update via GitHub API
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Read the newly-generated manifest and encode it as base64 for the API.
          CONTENT=$(base64 -w 0 manifest.json)

          # Get the current blob SHA of manifest.json on main — required by the API to
          # perform an update (prevents accidental overwrites).
          BLOB_SHA=$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/manifest.json" \
            | jq -r '.sha')

          # Update the file atomically via the Contents API. This never has git merge
          # conflicts regardless of concurrent CI runs or manual pushes.
          HTTP_STATUS=$(curl -s -o /tmp/api_response.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/manifest.json" \
            -d "{
              \"message\": \"Update manifest to ${TAG_VERSION} [ci skip]\",
              \"content\": \"${CONTENT}\",
              \"sha\": \"${BLOB_SHA}\"
            }")

          if [[ "$HTTP_STATUS" -ge 200 && "$HTTP_STATUS" -lt 300 ]]; then
            echo "manifest.json updated on main (HTTP ${HTTP_STATUS})"
          else
            echo "GitHub API returned HTTP ${HTTP_STATUS}:"
            cat /tmp/api_response.json
            exit 1
          fi

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packaged release
        uses: actions/download-artifact@v4
        with:
          name: jellyfin-postgres-plugin
          path: release_artifact

      - name: Create GitHub release with ZIP asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release_artifact/Jellyfin.Database.Providers.Postgres.zip
            release_artifact/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
